[project]
name = "3d-maker"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # only preview rules named in select (PLW1514)
select = ["E", "F", "W", "I", "B", "UP", "PLW1514"]  # PLW1514: Windows defaults to cp1252
# B008: FastAPI's File()/Form()/Depends() defaults are the framework idiom.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ui: browser tests driven by Playwright (need Chromium)",
]
filterwarnings = ["ignore::DeprecationWarning"]
